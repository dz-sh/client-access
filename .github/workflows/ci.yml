name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast gate
    uses: ./.github/workflows/_ci-quality.yml

  linux-runtime:
    name: Linux runtime lane
    needs: quality
    uses: ./.github/workflows/_ci-linux-runtime.yml

  openwrt-sdk:
    name: OpenWrt SDK lane
    needs: quality
    uses: ./.github/workflows/_ci-openwrt-sdk.yml

  immortalwrt-sdk:
    name: ImmortalWrt SDK lane
    needs: quality
    uses: ./.github/workflows/_ci-immortalwrt-sdk.yml

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - linux-runtime
      - openwrt-sdk
      - immortalwrt-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate required lane results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LINUX_RESULT: ${{ needs['linux-runtime'].result }}
          OPENWRT_RESULT: ${{ needs['openwrt-sdk'].result }}
          IMMORTALWRT_RESULT: ${{ needs['immortalwrt-sdk'].result }}
        run: |
          {
            echo '### Client Access CI Gate'
            echo
            echo '| Lane | Result |'
            echo '|---|---|'
            printf '| Fast gate | `%s` |\n' "${QUALITY_RESULT}"
            printf '| Linux runtime | `%s` |\n' "${LINUX_RESULT}"
            printf '| OpenWrt SDK | `%s` |\n' "${OPENWRT_RESULT}"
            printf '| ImmortalWrt SDK | `%s` |\n' "${IMMORTALWRT_RESULT}"
          } >>"${GITHUB_STEP_SUMMARY}"

          for result in \
            "${QUALITY_RESULT}" \
            "${LINUX_RESULT}" \
            "${OPENWRT_RESULT}" \
            "${IMMORTALWRT_RESULT}"; do
            if [[ "${result}" != success ]]; then
              echo "required CI lane did not succeed: ${result}" >&2
              exit 1
            fi
          done
